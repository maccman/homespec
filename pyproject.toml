[project]
name = "homespec"
version = "0.1.0"
description = "A house as source code: one spec compiles into the contractor's model, drawings, schedules, checks and a walkthrough."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "Alex MacCaw" }]
keywords = ["architecture", "bim", "ifc", "cad", "blender", "parametric"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "build123d>=0.9",
  "ifcopenshell>=0.8",
  "ifctester>=0.8",
  "numpy>=1.26",
  "pydantic>=2.6",
  "shapely>=2.0",
  "ezdxf>=1.3",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "pyright>=1.1"]

[project.scripts]
homespec = "homespec.cli:main"

[project.urls]
Homepage = "https://github.com/maccman/homespec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homespec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"projects/**" = ["F403", "F405"]

[tool.pyright]
include = ["homespec"]
exclude = ["homespec/blender"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingModuleSource = false
